[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "before-you-call-it"
version = "0.1.0"
description = "A local, source-run support handoff prototype"
requires-python = ">=3.10"
dependencies = ["psutil>=7.0,<8"]

[project.scripts]
before-you-call-it = "before_you_call_it.cli:main"

[tool.setuptools.packages.find]
include = ["before_you_call_it*"]
